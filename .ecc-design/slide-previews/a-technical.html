<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>A 精确技术发布</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow-x:hidden}html{scroll-snap-type:y mandatory;scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.slide{width:100%;height:100vh;height:100dvh;overflow:hidden;scroll-snap-align:start;position:relative}.slide-content{height:100%;max-height:100%;overflow:hidden;padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap)}:root{--pad:clamp(18px,4vw,64px);--gap:clamp(12px,2.4vh,30px);--title:clamp(25px,min(4.2vw,6.2vh),64px);--heading:clamp(17px,min(2.2vw,3.6vh),30px);--body:clamp(14px,min(1.45vw,2.45vh),21px);--meta:clamp(12px,min(1vw,1.8vh),15px)}h1,h2,p{margin:0}h1{font-size:var(--title);letter-spacing:-.035em;line-height:1.12}h2{font-size:var(--heading);line-height:1.2}p{font-size:var(--body);line-height:1.55}strong{font-weight:700}.tag{font-size:var(--meta)}@media(max-height:700px){:root{--pad:clamp(16px,3vw,36px);--gap:clamp(10px,2vh,20px)}}@media(max-height:500px){:root{--pad:clamp(14px,2.5vw,22px);--gap:clamp(8px,1.8vh,12px);--title:clamp(22px,min(3.7vw,7vh),30px);--heading:clamp(15px,min(2.5vw,5vh),19px);--body:clamp(12px,min(1.8vw,3.8vh),15px);--meta:clamp(11px,min(1.5vw,3vh),12px)}p{line-height:1.35}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


:root{--ink:#111a32;--blue:#214adb;--line:#cbd4ec}body{background:#fff;color:var(--ink)}.slide-content{padding-left:clamp(22px,5vw,72px);padding-right:clamp(22px,5vw,72px)}header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:clamp(10px,2vh,24px)}header h1{max-width:900px}header .index{font-size:var(--meta);color:#4a5775;font-weight:650}.comparison{display:grid;grid-template-columns:1fr 1fr;flex:1;min-height:0;border-bottom:2px solid var(--ink)}article{padding:clamp(12px,3vh,38px) clamp(10px,2.7vw,40px) clamp(10px,2vh,24px) 0;display:flex;flex-direction:column;gap:clamp(9px,2vh,24px);min-width:0;justify-content:center}article+article{padding-left:clamp(14px,3vw,44px);padding-right:0;border-left:1px solid var(--line)}.name{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:clamp(15px,min(1.8vw,3.3vh),25px);font-weight:700;color:var(--blue)}article p{max-width:29em}.microflow{display:flex;align-items:center;flex-wrap:wrap;gap:clamp(5px,1vw,14px);margin-top:clamp(4px,1.5vh,16px);font-size:var(--meta);font-weight:650}.step{border:1px solid var(--line);padding:clamp(5px,.7vw,10px) clamp(7px,1vw,14px);white-space:nowrap}.step.primary{background:var(--blue);border-color:var(--blue);color:#fff}.arrow{color:var(--blue);font-weight:800}.decision{display:flex;gap:clamp(12px,2vw,26px);align-items:baseline}.decision b{color:var(--blue);font-size:var(--meta);white-space:nowrap}.decision p{font-weight:650}@media(max-width:600px) and (min-height:501px){header .index{display:none}.comparison{grid-template-columns:1fr}article{padding:12px 0;gap:8px}article+article{border-left:0;border-top:1px solid var(--line);padding:12px 0}.microflow{margin-top:0}.decision p{font-size:14px}}@media(max-height:500px){article{gap:7px;padding-top:10px}.microflow{gap:5px}.step{padding:4px 6px}.decision p{font-size:var(--body)}}
</style></head><body><main class="slide"><div class="slide-content"><header><h1>并发任务失败时，<br>其他任务会怎样？</h1><span class="index">并发语义 · 01</span></header><div class="comparison"><article><span class="name">gather()</span><h2>先传播首个异常</h2><p>默认把第一个异常交给调用方，<strong>其余任务继续运行</strong>。</p><div class="microflow" aria-label="gather 失败流程"><span class="step primary">任务失败</span><span class="arrow" aria-hidden="true">→</span><span class="step">首错传播</span><span class="arrow" aria-hidden="true">·</span><span class="step">其余继续</span></div></article><article><span class="name">TaskGroup</span><h2>先协同取消，再汇总</h2><p>非 <code>CancelledError</code> 失败会取消其余任务，退出时<strong>汇总异常组</strong>。</p><div class="microflow" aria-label="TaskGroup 失败流程"><span class="step primary">任务失败</span><span class="arrow" aria-hidden="true">→</span><span class="step">取消其余</span><span class="arrow" aria-hidden="true">→</span><span class="step">汇总异常组</span></div></article></div><footer class="decision"><b>选择提示</b><p>需要失败后联动停止时，考虑使用 TaskGroup。</p></footer></div></main></body></html>
