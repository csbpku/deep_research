<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>C 明亮教学</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow-x:hidden}html{scroll-snap-type:y mandatory;scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.slide{width:100%;height:100vh;height:100dvh;overflow:hidden;scroll-snap-align:start;position:relative}.slide-content{height:100%;max-height:100%;overflow:hidden;padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap)}:root{--pad:clamp(18px,4vw,64px);--gap:clamp(12px,2.4vh,30px);--title:clamp(25px,min(4.2vw,6.2vh),64px);--heading:clamp(17px,min(2.2vw,3.6vh),30px);--body:clamp(14px,min(1.45vw,2.45vh),21px);--meta:clamp(12px,min(1vw,1.8vh),15px)}h1,h2,p{margin:0}h1{font-size:var(--title);letter-spacing:-.035em;line-height:1.12}h2{font-size:var(--heading);line-height:1.2}p{font-size:var(--body);line-height:1.55}strong{font-weight:700}.tag{font-size:var(--meta)}@media(max-height:700px){:root{--pad:clamp(16px,3vw,36px);--gap:clamp(10px,2vh,20px)}}@media(max-height:500px){:root{--pad:clamp(14px,2.5vw,22px);--gap:clamp(8px,1.8vh,12px);--title:clamp(22px,min(3.7vw,7vh),30px);--heading:clamp(15px,min(2.5vw,5vh),19px);--body:clamp(12px,min(1.8vw,3.8vh),15px);--meta:clamp(11px,min(1.5vw,3vh),12px)}p{line-height:1.35}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


:root{--ink:#102d43;--blue:#174dba;--muted:#36586d;--mint:#e8f8f0;--line:#a4c9c7}body{background:var(--mint);color:var(--ink)}.slide-content{gap:clamp(9px,2vh,22px)}header{display:flex;justify-content:space-between;align-items:flex-end}header h1{max-width:16em}.page{font-size:var(--meta);font-weight:700;color:var(--muted)}.lanes{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,2vw,28px);flex:1;min-height:0}.lane{background:#fff;border:1px solid var(--line);border-radius:clamp(10px,1.5vw,18px);padding:clamp(12px,2vw,28px);display:flex;flex-direction:column;gap:clamp(8px,1.8vh,22px);min-width:0}.lane h2{display:flex;align-items:baseline;gap:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.lane h2 span{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-weight:500;font-size:var(--meta);color:var(--muted)}.flow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(5px,1vw,14px);margin:auto 0}.tasks{display:grid;gap:clamp(4px,.7vh,8px)}.node{background:#ecf6fc;border:1px solid #c6dfea;border-radius:6px;padding:clamp(5px,.8vw,10px);text-align:center;font-size:var(--meta);font-weight:700;line-height:1.25}.node.fail{background:#174dba;color:#fff;border-color:#174dba}.result-node{background:#d7f2e6;border-color:#a4c9c7;padding:clamp(10px,1.8vw,20px)}.connector{color:var(--blue);font-size:clamp(14px,1.6vw,22px);font-weight:800}.takeaway{display:flex;gap:12px;align-items:baseline}.takeaway span{font-weight:800;color:var(--blue);font-size:var(--meta);white-space:nowrap}.takeaway p{font-weight:650}@media(max-width:600px) and (min-height:501px){header .page{display:none}.lanes{grid-template-columns:1fr}.lane{gap:7px;padding:12px}.flow{margin-top:0}.takeaway p{font-size:14px}}@media(max-height:500px){.lane{gap:6px;padding:10px}.flow{gap:4px}.node{padding:5px}.lanes{gap:10px}}
</style></head><body><main class="slide"><div class="slide-content"><header><h1>一个任务失败后，<br>其他任务的去向</h1><span class="page">并发任务 · 01</span></header><div class="lanes"><article class="lane"><h2>gather() <span>默认行为</span></h2><p>第一个异常传播给调用方，其他任务继续运行。</p><div class="flow" role="img" aria-label="任务 A 失败时，任务 B 和 C 继续，首个异常传播给调用方"><div class="tasks"><span class="node fail">任务 A · 失败</span><span class="node">任务 B · 继续</span><span class="node">任务 C · 继续</span></div><span class="connector" aria-hidden="true">→</span><span class="node result-node">首个异常<br>传播给调用方</span></div></article><article class="lane"><h2>TaskGroup <span>结构化并发</span></h2><p>非 <code>CancelledError</code> 失败会取消其余任务，退出时汇总异常组。</p><div class="flow" role="img" aria-label="任务 A 失败时，任务 B 和 C 被取消，任务组退出时汇总异常组"><div class="tasks"><span class="node fail">任务 A · 失败</span><span class="node">任务 B · 取消</span><span class="node">任务 C · 取消</span></div><span class="connector" aria-hidden="true">→</span><span class="node result-node">等待任务收束<br>汇总异常组</span></div></article></div><footer class="takeaway"><span>选择提示</span><p>需要失败后联动停止时，考虑使用 TaskGroup。</p></footer></div></main></body></html>
