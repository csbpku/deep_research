<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>B 温暖编辑式研究</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow-x:hidden}html{scroll-snap-type:y mandatory;scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.slide{width:100%;height:100vh;height:100dvh;overflow:hidden;scroll-snap-align:start;position:relative}.slide-content{height:100%;max-height:100%;overflow:hidden;padding:var(--pad);display:flex;flex-direction:column;gap:var(--gap)}:root{--pad:clamp(18px,4vw,64px);--gap:clamp(12px,2.4vh,30px);--title:clamp(25px,min(4.2vw,6.2vh),64px);--heading:clamp(17px,min(2.2vw,3.6vh),30px);--body:clamp(14px,min(1.45vw,2.45vh),21px);--meta:clamp(12px,min(1vw,1.8vh),15px)}h1,h2,p{margin:0}h1{font-size:var(--title);letter-spacing:-.035em;line-height:1.12}h2{font-size:var(--heading);line-height:1.2}p{font-size:var(--body);line-height:1.55}strong{font-weight:700}.tag{font-size:var(--meta)}@media(max-height:700px){:root{--pad:clamp(16px,3vw,36px);--gap:clamp(10px,2vh,20px)}}@media(max-height:500px){:root{--pad:clamp(14px,2.5vw,22px);--gap:clamp(8px,1.8vh,12px);--title:clamp(22px,min(3.7vw,7vh),30px);--heading:clamp(15px,min(2.5vw,5vh),19px);--body:clamp(12px,min(1.8vw,3.8vh),15px);--meta:clamp(11px,min(1.5vw,3vh),12px)}p{line-height:1.35}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


:root{--ink:#233530;--muted:#53635b;--teal:#126f66;--line:#b9c5b3}body{color:var(--ink);background:#f7f3e8}.slide-content{padding:clamp(20px,5vw,72px);gap:clamp(10px,2vh,24px)}.heading{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:clamp(10px,2vh,24px)}h1{font-family:Georgia,"Songti SC","STSong",serif;font-weight:600;max-width:14em}.page{font-size:var(--meta);color:var(--muted);white-space:nowrap}.editorial{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}.entry{display:grid;grid-template-columns:minmax(0,1fr);align-content:center;gap:clamp(8px,2vh,20px);padding-right:clamp(18px,4vw,60px)}.entry+.entry{border-left:1px solid var(--line);padding-right:0;padding-left:clamp(18px,4vw,60px)}.entry h2{font-family:Georgia,"Songti SC","STSong",serif;font-weight:600}.entry h2 code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.75em;color:var(--teal)}.entry p{max-width:28em}.underline{color:var(--teal);text-decoration:underline;text-decoration-color:#8eb8aa;text-underline-offset:.18em}.takeaway{border-top:1px solid var(--ink);padding-top:clamp(10px,2vh,22px);display:grid;grid-template-columns:auto 1fr;gap:clamp(12px,2vw,24px);align-items:baseline}.takeaway span{color:var(--teal);font-weight:700;font-size:var(--meta)}.takeaway p{font-family:Georgia,"Songti SC","STSong",serif;font-weight:600}@media(max-width:600px) and (min-height:501px){.heading .page{display:none}.editorial{grid-template-columns:1fr}.entry{padding:10px 0;gap:6px}.entry+.entry{border-left:0;border-top:1px solid var(--line);padding:10px 0}.takeaway p{font-size:14px}}@media(max-height:500px){.entry{gap:7px}.takeaway{padding-top:8px}.heading{padding-bottom:8px}}
</style></head><body><main class="slide"><div class="slide-content"><header class="heading"><h1>异常发生之后，<br>任务如何收场</h1><span class="page">研究笔记 · 01</span></header><div class="editorial"><article class="entry"><h2><code>gather()</code><br>先交出异常</h2><p>默认向调用方传播第一个异常，<span class="underline">其他任务继续运行</span>。</p></article><article class="entry"><h2><code>TaskGroup</code><br>先收束任务</h2><p>非 <code>CancelledError</code> 失败会取消其余任务，退出时<span class="underline">汇总异常组</span>。</p></article></div><footer class="takeaway"><span>判断</span><p>需要失败后联动停止时，考虑使用 TaskGroup。</p></footer></div></main></body></html>
