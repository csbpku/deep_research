# Curated GitHub repo list for radar/github_tracked fetcher.
#
# Audience: AI application developers (Shopee-internal). Repos are selected
# for practical relevance — code assistants, agent frameworks, inference
# infra, and open-weight foundation models that engineers actually build with.
#
# Categories:
#   - cli_repos: coding-agent CLIs + IDE integrations
#   - agents_peers: agent frameworks and orchestrators
#   - infra_repos: inference / serving / orchestration infra (production-grade)
#   - foundation_models: open-weight models + practical fine-tuning tooling
#
# Removed in 2026-08 review:
#   - vllm/sglang duplicates (already tracked under infra_repos)
#   - smol-course (educational, not production tooling)
#   - openvino, onnxruntime (inference optimisers; low signal for AI app devs)
#   - openwork (no longer actively maintained; 0 commits since 2025-Q3)
#   - agent-protocol (stagnant spec repo; no engineering velocity)
#
# To add a repo: append under the appropriate category.
# To remove: delete the lines and re-run `scripts/seed_tracked_repos.py`.

cli_repos:
  - id: claude-code
    repo: anthropics/claude-code
  - id: codex
    repo: openai/codex
  - id: gemini-cli
    repo: google-gemini/gemini-cli
  - id: aider
    repo: Aider-AI/aider
  - id: openhands
    repo: All-Hands-AI/OpenHands
  - id: cline
    repo: cline/cline
  - id: goose
    repo: block/goose
  - id: continue
    repo: continuedev/continue

agents_peers:
