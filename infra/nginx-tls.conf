# TLS-enabled nginx config for production deployments.
#
# Swap this in place of nginx.conf when you have valid certs in ./certs/:
#   - fullchain.pem   (certificate + intermediates)
#   - privkey.pem     (private key, mode 0600)
#
# Local dev / intranet should keep using the HTTP-only nginx.conf.

user nginx;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    log_format json escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"status":$status,'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"ip":"$remote_addr",'
            '"ua":"$http_user_agent",'
            '"rt":$request_time,'
            '"upstream_rt":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json;

    client_max_body_size 5m;

    upstream web_upstream {
        server web:3000;
    }
    upstream ai_engine_upstream {
        server ai-engine:4000;
    }

    # ──────────────── HTTP → HTTPS redirect ────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ──────────────── HTTPS ─────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ai/ {
            proxy_pass http://ai_engine_upstream/;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location /healthz {
            access_log off;
            proxy_pass http://web_upstream/api/healthz;
            proxy_set_header Host $host;
        }

        location /ai-healthz {
            access_log off;
            proxy_pass http://ai_engine_upstream/healthz;
            proxy_set_header Host $host;
        }
    }
}
