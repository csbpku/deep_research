# TLS-enabled nginx config for production deployments.
#
# Swap this in place of nginx.conf when you have valid certs in ./certs/:
#   - fullchain.pem   (certificate + intermediates)
#   - privkey.pem     (private key, mode 0600)
#
# Local dev / intranet should keep using the HTTP-only nginx.conf.

user nginx;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    error_log /dev/stderr warn;

    log_format json escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"status":$status,'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"ip":"$remote_addr",'
            '"ua":"$http_user_agent",'
            '"rt":$request_time,'
            '"upstream_rt":"$upstream_response_time"'
        '}';

    # Docker owns log retention; keep request logs on the container stream so
    # a bind-mounted filesystem cannot take the reverse proxy down.
    access_log /dev/stdout json;

    client_max_body_size 5m;

    upstream web_upstream {
        server web:3000;
    }
    upstream ai_engine_upstream {
        server ai-engine:4000;
    }

    # ──────────────── HTTP → HTTPS redirect ────────────────
    server {
        listen 80;
        server_name techradar.top;

        # Keep ACME renewal independent from the HTTPS certificate itself.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://techradar.top$request_uri;
        }
    }

    # ──────────────── HTTPS ─────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name techradar.top;

        ssl_certificate     /etc/nginx/certs/live/techradar.top/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/techradar.top/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # The browser reader lives in the Chrome side panel and frames this
        # route. Preserve DENY everywhere else, while allowing extension
        # origins here through CSP frame-ancestors.
        location = /reading/panel {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_hide_header X-Frame-Options;
            add_header Content-Security-Policy "frame-ancestors 'self' chrome-extension://*;" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        }

        # Keep SSE chunks observable as they arrive at the browser reader.
        location = /api/reading/answer/stream {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        location /ai/ {
            proxy_pass http://ai_engine_upstream/;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        location /healthz {
            access_log off;
            proxy_pass http://web_upstream/api/healthz;
            proxy_set_header Host $host;
        }

        location /ai-healthz {
            access_log off;
            proxy_pass http://ai_engine_upstream/healthz;
            proxy_set_header Host $host;
        }
    }
}
