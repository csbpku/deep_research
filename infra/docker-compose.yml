# Docker Compose for the Deep Research platform (P0 target topology).
#
# 服务：
#   - postgres (16-alpine)：业务库 + 两个任务队列 + 全文索引
#   - web (apps/web)：Next.js 15 + BFF + Prisma client
#   - ai-engine (packages/ai-engine)：FastAPI + workers
#   - anythingllm：可选 AI 讨论后端，仅暴露在 Compose 内网
#   - render-review（可选 browser-review profile）：Node + Chromium sidecar，执行真实页面审核
#   - nginx (1.27-alpine)：TLS 终止 + 反代
#
# 重要约定（架构 §十三 §3）：
#   - import-tmp 是隔离卷；不进入数据库备份
#   - backups 挂到 postgres 容器内 /backups，由 pg-backup.sh 写入
#   - 健康检查：postgres 用 pg_isready；web/ai-engine 用各自 /healthz
#
# 启动：
#   cp .env.example .env && vi .env   # 填 TAVILY/ANTHROPIC key
#   docker compose build
#   docker compose up -d
#
# 备份：
#   docker compose exec postgres bash -c '/usr/local/bin/pg-backup.sh'
#
# 清理：
#   docker compose exec web bash -c '/usr/local/bin/import-tmp-cleanup.sh --apply'

name: deep-research

x-json-logging: &json-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *json-logging
    environment:
      POSTGRES_USER: postgres
      # W9 code review 修订：此前硬编码 postgres/postgres。改为强制从 .env 注入，
      # 缺失时 compose 直接失败，不给弱口令留默认值。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: deep_research
    ports:
      # W9 code review 修订：此前是 "5432:5432"，即绑 0.0.0.0，部署到 VPS 后
      # Postgres 直接暴露在公网。web / ai-engine 走 compose 内网访问，不需要
      # 端口映射；这里只绑回环，保留本机 psql / Prisma Studio 的调试通路。
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 400M

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    logging: *json-logging
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@${DATABASE_HOST:-postgres}:5432/deep_research
      AI_ENGINE_URL: http://ai-engine:4000
      IMPORT_TEMP_DIR: /data/import-tmp
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set in .env}
      READING_EXTENSION_IDS: ${READING_EXTENSION_IDS:-}
      READING_EXTENSION_BETA_URL: ${READING_EXTENSION_BETA_URL:-}
      READING_EXTENSION_BETA_PATH: ${READING_EXTENSION_BETA_PATH:-}
      READING_EXTENSION_BETA_VERSION: ${READING_EXTENSION_BETA_VERSION:-0.2.3}
      READING_EXTENSION_BETA_SHA256: ${READING_EXTENSION_BETA_SHA256:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      AUTH_GOOGLE_ONLY: ${AUTH_GOOGLE_ONLY:-0}
      AUTH_BETA_MODE: ${AUTH_BETA_MODE:-0}
      AUTH_EMAIL_VERIFICATION: ${AUTH_EMAIL_VERIFICATION:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      AUTH_INVITE_CODE: ${AUTH_INVITE_CODE:-}
      AUTH_ALLOW_INSECURE_HTTP: ${AUTH_ALLOW_INSECURE_HTTP:-0}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-shaobo.chen@shopee.com}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
      RADAR_RENDER_REVIEW_ENABLED: ${RADAR_RENDER_REVIEW_ENABLED:-0}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
      TIME_VALUE_USD_PER_HOUR: ${TIME_VALUE_USD_PER_HOUR:-50}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_started
    volumes:
      - import-tmp:/data/import-tmp       # P0 文件导入隔离
      - ./logs/web:/var/log/web           # 结构化访问日志
      - ./import-tmp-cleanup.sh:/usr/local/bin/import-tmp-cleanup.sh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # HEALTHCHECK 已写在 Dockerfile 内
    deploy:
      resources:
        limits:
          memory: 400M

  ai-engine:
    build:
      context: ..
      dockerfile: infra/ai-engine.Dockerfile
    restart: unless-stopped
    logging: *json-logging
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@${DATABASE_HOST:-postgres}:5432/deep_research
      JOB_RUNNER_BACKEND: db
      AI_ENGINE_ADAPTER: ${AI_ENGINE_ADAPTER:-gpt_researcher}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set in .env}
      # Canonical purpose-based routing. Legacy slots below remain for
      # compatibility with older gpt-researcher integrations.
      RESEARCH_LLM: ${RESEARCH_LLM:-}
      UTILITY_LLM: ${UTILITY_LLM:-}
      FALLBACK_LLM: ${FALLBACK_LLM:-}
      LLM_FALLBACK_LLM: ${LLM_FALLBACK_LLM:-}
      SMART_LLM: ${SMART_LLM:-anthropic:deepseek-v4-pro}
      FAST_LLM: ${FAST_LLM:-anthropic:deepseek-v4-flash}
      STRATEGIC_LLM: ${STRATEGIC_LLM:-anthropic:deepseek-v4-pro}
      BRIEF_LLM: ${BRIEF_LLM:-anthropic:deepseek-v4-flash}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      RETRIEVER: ${RETRIEVER:-tavily}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # Heavy tier (Shopee compass gateway) — optional, falls back to light.
      ANTHROPIC_API_KEY_HEAVY: ${ANTHROPIC_API_KEY_HEAVY:-}
      ANTHROPIC_BASE_URL_HEAVY: ${ANTHROPIC_BASE_URL_HEAVY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY_HEAVY: ${OPENAI_API_KEY_HEAVY:-}
      OPENAI_BASE_URL_HEAVY: ${OPENAI_BASE_URL_HEAVY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-}
      MINIMAX_API_KEY_HEAVY: ${MINIMAX_API_KEY_HEAVY:-}
      MINIMAX_BASE_URL_HEAVY: ${MINIMAX_BASE_URL_HEAVY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DEEPSEEK_API_KEY_HEAVY: ${DEEPSEEK_API_KEY_HEAVY:-}
      DEEPSEEK_BASE_URL_HEAVY: ${DEEPSEEK_BASE_URL_HEAVY:-}
      # Optional AnythingLLM discussion backend. Keep the key in the host
      # .env; never bake it into the image or commit it to the repository.
      ANYTHINGLLM_URL: ${ANYTHINGLLM_URL:-}
      ANYTHINGLLM_API_KEY: ${ANYTHINGLLM_API_KEY:-}
      ANYTHINGLLM_WORKSPACE: ${ANYTHINGLLM_WORKSPACE:-}
      ANYTHINGLLM_ENABLED: ${ANYTHINGLLM_ENABLED:-true}
      ANYTHINGLLM_RADAR_IDS: ${ANYTHINGLLM_RADAR_IDS:-}
      # Radar 源 token（缺失时对应源快速失败，不影响其他源）
      GH_TOKEN: ${GH_TOKEN:-}
      PRODUCTHUNT_API_TOKEN: ${PRODUCTHUNT_API_TOKEN:-}
      WEWE_AUTH_CODE: ${WEWE_AUTH_CODE:-}
      # Radar deep-dive feature flag (Phase 0+)
      RADAR_DEEPDIVE_ENABLED: ${RADAR_DEEPDIVE_ENABLED:-true}
      # Browser mode is the product default. In this mode
      # new radar rows use source metadata and keep the original URL; automatic
      # article/Zread capture and enrichment are skipped. Historical rows and
      # the legacy code remain available for a later explicit rollback.
      RADAR_READING_MODE: ${RADAR_READING_MODE:-browser}
      RADAR_ENRICHMENT_ENABLED: ${RADAR_ENRICHMENT_ENABLED:-0}
      BUDGET_TEAM_DAILY: ${BUDGET_TEAM_DAILY:-20}
      BUDGET_USER_DAILY: ${BUDGET_USER_DAILY:-5}
      DEEP_RESEARCH_TIMEOUT_SECONDS: ${DEEP_RESEARCH_TIMEOUT_SECONDS:-1200}
      WORKER_JOB_TIMEOUT_SECONDS: ${WORKER_JOB_TIMEOUT_SECONDS:-300}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-15}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
      WORKER_REAPER_INTERVAL_SECONDS: ${WORKER_REAPER_INTERVAL_SECONDS:-30}
      LLM_RECOVERY_ENABLED: ${LLM_RECOVERY_ENABLED:-1}
      LLM_RECOVERY_INTERVAL_SECONDS: ${LLM_RECOVERY_INTERVAL_SECONDS:-600}
      LLM_RECOVERY_LIMIT: ${LLM_RECOVERY_LIMIT:-50}
      RADAR_CONTENT_RECOVERY_LIMIT: ${RADAR_CONTENT_RECOVERY_LIMIT:-5}
      RADAR_CONTENT_RECOVERY_MAX_ATTEMPTS: ${RADAR_CONTENT_RECOVERY_MAX_ATTEMPTS:-3}
      RADAR_CONTENT_RECOVERY_COOLDOWN_MINUTES: ${RADAR_CONTENT_RECOVERY_COOLDOWN_MINUTES:-15}
      RADAR_CONTENT_RECOVERY_ITEM_TIMEOUT_SECONDS: ${RADAR_CONTENT_RECOVERY_ITEM_TIMEOUT_SECONDS:-300}
      LLM_USAGE_AUDIT_ENABLED: ${LLM_USAGE_AUDIT_ENABLED:-true}
      RADAR_ENRICHMENT_RECOVERY_ENABLED: ${RADAR_ENRICHMENT_RECOVERY_ENABLED:-1}
      RADAR_ENRICHMENT_RECOVERY_INTERVAL_SECONDS: ${RADAR_ENRICHMENT_RECOVERY_INTERVAL_SECONDS:-60}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-90}
      RADAR_SOURCE_CONCURRENCY: ${RADAR_SOURCE_CONCURRENCY:-5}
      RADAR_CANDIDATE_CONCURRENCY: ${RADAR_CANDIDATE_CONCURRENCY:-3}
      RADAR_LLM_CONCURRENCY: ${RADAR_LLM_CONCURRENCY:-8}
      RADAR_SCORING_CONCURRENCY: ${RADAR_SCORING_CONCURRENCY:-8}
      RADAR_ENRICHMENT_CONCURRENCY: ${RADAR_ENRICHMENT_CONCURRENCY:-2}
      RADAR_ENRICHMENT_HEARTBEAT_SECONDS: ${RADAR_ENRICHMENT_HEARTBEAT_SECONDS:-60}
      # 0 delegates the budget to the durable source worker/Zread CLI. Set a
      # positive value only when an operator explicitly wants an outer cap.
      RADAR_ENRICHMENT_ITEM_TIMEOUT_SECONDS: ${RADAR_ENRICHMENT_ITEM_TIMEOUT_SECONDS:-0}
      RADAR_ENRICHMENT_LEASE_SECONDS: ${RADAR_ENRICHMENT_LEASE_SECONDS:-900}
      # GitHub repo enrichment order: public Zread -> local zread CLI -> README.
      # The CLI is installed in the AI image; its checkout/drafts survive
      # container replacement through this dedicated volume.
      ZREAD_REMOTE_ENABLED: ${ZREAD_REMOTE_ENABLED:-1}
      ZREAD_CLI_ENABLED: ${ZREAD_CLI_ENABLED:-1}
      ZREAD_CLI_BIN: ${ZREAD_CLI_BIN:-zread}
      ZREAD_CLI_WORK_DIR: ${ZREAD_CLI_WORK_DIR:-/data/zread}
      ZREAD_CLI_TIMEOUT_SECONDS: ${ZREAD_CLI_TIMEOUT_SECONDS:-7200}
      # Browser rendering is an opt-in production capability. Content review,
      # reader quality and enrichment remain enabled when this is off.
      RADAR_RENDER_REVIEW_ENABLED: ${RADAR_RENDER_REVIEW_ENABLED:-0}
      RADAR_RENDER_REVIEW_SERVICE_URL: ${RADAR_RENDER_REVIEW_SERVICE_URL:-http://render-review:4100}
      # This is the Compose-internal Web address; do not inherit a native
      # developer value such as 127.0.0.1 into the sidecar.
      RADAR_RENDER_REVIEW_BASE_URL: http://web:3000
      RADAR_RENDER_REVIEW_INTERVAL_SECONDS: ${RADAR_RENDER_REVIEW_INTERVAL_SECONDS:-30}
      RADAR_RENDER_REVIEW_BATCH_SIZE: ${RADAR_RENDER_REVIEW_BATCH_SIZE:-1}
      RADAR_RENDER_REVIEW_TIMEOUT_SECONDS: ${RADAR_RENDER_REVIEW_TIMEOUT_SECONDS:-150}
      RADAR_RENDER_REVIEW_STALE_MINUTES: ${RADAR_RENDER_REVIEW_STALE_MINUTES:-30}
      HUGGINGFACE_BASE_URL: ${HUGGINGFACE_BASE_URL:-https://huggingface.co}
      HUGGINGFACE_TIMEOUT_SECONDS: ${HUGGINGFACE_TIMEOUT_SECONDS:-30}
      HUGGINGFACE_FETCH_RETRIES: ${HUGGINGFACE_FETCH_RETRIES:-2}
      RADAR_SYNC_CRON_TIME: ${RADAR_SYNC_CRON_TIME:-02:00}
      URL_FETCH_MAX_BYTES: ${URL_FETCH_MAX_BYTES:-2097152}
      URL_FETCH_TIMEOUT_SECONDS: ${URL_FETCH_TIMEOUT_SECONDS:-10}
      URL_FETCH_MAX_REDIRECTS: ${URL_FETCH_MAX_REDIRECTS:-3}
      IMPORT_TEMP_DIR: /data/import-tmp
      IMPORT_WORKER_ENABLED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs/ai-engine:/var/log/ai-engine
      - import-tmp:/data/import-tmp
      - zread-work:/data/zread
    # HEALTHCHECK 已写在 Dockerfile 内

  # AnythingLLM is intentionally internal-only. Configure its model and
  # workspace through the web UI over an SSH tunnel; the AI engine reaches it
  # at http://anythingllm:3001 on the Compose network.
  anythingllm:
    image: ghcr.io/mintplex-labs/anything-llm:latest
    restart: unless-stopped
    logging: *json-logging
    environment:
      STORAGE_DIR: /app/server/storage
    # Loopback-only host binding supports the SSH tunnel without exposing the
    # AnythingLLM UI or API on the public network interface.
    ports:
      - "127.0.0.1:3001:3001"
    expose:
      - "3001"
    cap_add:
      - SYS_ADMIN
    volumes:
      - anythingllm-storage:/app/server/storage
      - anythingllm-hotdir:/app/collector/hotdir
      - anythingllm-outputs:/app/collector/outputs
    deploy:
      resources:
        limits:
          memory: 900M

  render-review:
    profiles: ["browser-review"]
    build:
      context: ..
      dockerfile: infra/render-review.Dockerfile
    restart: unless-stopped
    logging: *json-logging
    environment:
      RENDER_REVIEW_PORT: 4100
      RADAR_RENDER_REVIEW_BASE_URL: http://web:3000
      RADAR_RENDER_REVIEW_TIMEOUT_SECONDS: ${RADAR_RENDER_REVIEW_TIMEOUT_SECONDS:-150}
    expose:
      - "4100"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *json-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Local / HTTP-only default. VPS packs and existing production .env files
      # can select nginx-tls.conf without changing this tracked topology.
      - ./${NGINX_CONFIG:-nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web
      - ai-engine

  # One-shot ACME client. Run with:
  #   docker compose --profile certbot run --rm certbot certonly ...
  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    volumes:
      - ./certs:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  postgres-data:
  import-tmp:
  zread-work:
  anythingllm-storage:
  anythingllm-hotdir:
  anythingllm-outputs:
