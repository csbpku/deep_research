# 本地 / 内网用：HTTP-only。
# 生产（公网试用）必须改挂 nginx-tls.conf —— 见 infra/README.md「TLS」。
# 这两份分开是因为 443 server 块在证书文件缺失时会让 nginx 整体启动失败，
# 本地没有证书，所以不能把 TLS 块直接写进这份。

user nginx;
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 结构化访问日志（架构 §十三 §8）
    log_format json escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"status":$status,'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"ip":"$remote_addr",'
            '"ua":"$http_user_agent",'
            '"rt":$request_time,'
            '"upstream_rt":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json;

    # 上传限制（与 apps/web/.env MAX_UPLOAD_SIZE_MB 一致）
    client_max_body_size 5m;

    upstream web_upstream {
        server web:3000;
    }
    upstream ai_engine_upstream {
        server ai-engine:4000;
    }

    # 安全响应头（W9 code review 修订：此前一个 add_header 都没有）。
    # HSTS 不在这份里 —— HTTP-only 场景下声明 HSTS 会把浏览器锁到
    # 一个没有 TLS 的源上，反而制造故障。HSTS 只在 nginx-tls.conf 里加。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    server {
        listen 80;
        server_name _;

        # 反代：所有 web 业务路由
        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 反代：AI 引擎（apps/web 通过 /ai/* 二次 rewrites，转发到 ai-engine）
        location /ai/ {
            proxy_pass http://ai_engine_upstream/;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;        # 长任务支持（架构 §九 风险 10）
        }

        # 健康检查：Web BFF 的 liveness（不打印 access log）
        location /healthz {
            access_log off;
            proxy_pass http://web_upstream/api/healthz;
            proxy_set_header Host $host;
        }

        # AI engine 健康（专用路径，便于 K8s livenessProbe 区分）
        location /ai-healthz {
            access_log off;
            proxy_pass http://ai_engine_upstream/healthz;
            proxy_set_header Host $host;
        }
    }
}
