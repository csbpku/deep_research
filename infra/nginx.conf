worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 结构化访问日志（架构 §十三 §8）
    log_format json escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"status":$status,'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"ip":"$remote_addr",'
            '"ua":"$http_user_agent",'
            '"rt":$request_time,'
            '"upstream_rt":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log json;

    # 上传限制（与 apps/web/.env MAX_UPLOAD_SIZE_MB 一致）
    client_max_body_size 5m;

    upstream web_upstream {
        server web:3000;
    }
    upstream ai_engine_upstream {
        server ai-engine:4000;
    }

    server {
        listen 80;
        server_name _;

        # 反代：所有 web 业务路由
        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 反代：AI 引擎（apps/web 通过 /ai/* 二次 rewrites，转发到 ai-engine）
        location /ai/ {
            proxy_pass http://ai_engine_upstream/;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;        # 长任务支持（架构 §九 风险 10）
        }

        # 健康检查
        location /healthz {
            access_log off;
            return 200 "ok\n";
        }
    }
}
