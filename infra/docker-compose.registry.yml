# Registry-image override for production deployments.
#
# Combine with docker-compose.yml:
#   docker compose \
#     --env-file .env \
#     -f infra/docker-compose.yml \
#     -f infra/docker-compose.registry.yml \
#     up -d --no-build
#
# WEB_IMAGE and AI_ENGINE_IMAGE should be immutable registry references, ideally
# tagged with the Git commit SHA. Runtime secrets remain in the host .env file.

services:
  anythingllm:
    # Provision this private file from AnythingLLM's system settings on the
    # VPS. API/UI updates write inside the container, so refresh this snapshot
    # after changing providers to preserve the selection across recreation.
    env_file:
      - path: ./anythingllm/.env
        required: false

  nginx:
    # Preserve the host's explicit TLS choice during registry-image deploys;
    # otherwise every release would silently put nginx back on HTTP-only.
    volumes:
      - ./${NGINX_CONFIG:-nginx.conf}:/etc/nginx/nginx.conf:ro

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE to a registry image}
    # Compose's !reset removes the local build definition from the base file.
    # This keeps an accidental `up` from rebuilding on the VPS.
    build: !reset null
    environment:
      RADAR_RENDER_REVIEW_ENABLED: "0"
      NODE_OPTIONS: "--max-old-space-size=256"

  ai-engine:
    image: ${AI_ENGINE_IMAGE:?set AI_ENGINE_IMAGE to a registry image}
    build: !reset null
    environment:
      AI_ENGINE_OPENAPI_ENABLED: "0"
      # Keep the small VPS deployment free of the Chromium sidecar even when
      # an older host .env still contains RADAR_RENDER_REVIEW_ENABLED=1.
      RADAR_RENDER_REVIEW_ENABLED: "0"
      RADAR_RENDER_REVIEW_SERVICE_URL: ""
      # The VPS has 2 vCPUs and 1.8 GiB RAM. Keep background work bounded so
      # a radar burst cannot starve the API or PostgreSQL. Local development
      # keeps the higher-throughput defaults from docker-compose.yml.
      DB_POOL_MIN_SIZE: "1"
      # The main process shares this pool across the AI queue, fact review,
      # radar recovery consumers and API reads. Four connections allowed a
      # short background burst to exhaust the pool and surface as PoolTimeout
      # at the end of an otherwise healthy long research run.
      DB_POOL_MAX_SIZE: "8"
      DB_POOL_TIMEOUT_SECONDS: "90"
      RADAR_SOURCE_CONCURRENCY: ${RADAR_SOURCE_CONCURRENCY:-2}
      RADAR_CANDIDATE_CONCURRENCY: ${RADAR_CANDIDATE_CONCURRENCY:-1}
      # Reading translation batches many blocks per request, so a low LLM
      # semaphore serialises the whole page into waves of queued calls. Six
      # in-flight provider requests measured ~45% faster wall time on a
      # 287-block article with no extra failures; the retry backoff in
      # ai_engine.llm.client absorbs the transient 529s that appear above
      # this level. Override via .env to lower it for a smaller host.
      RADAR_LLM_CONCURRENCY: ${RADAR_LLM_CONCURRENCY:-6}
      RADAR_SCORING_CONCURRENCY: ${RADAR_SCORING_CONCURRENCY:-2}
      RADAR_ENRICHMENT_CONCURRENCY: ${RADAR_ENRICHMENT_CONCURRENCY:-1}
      RADAR_CONTENT_RECOVERY_LIMIT: "2"
      LLM_RECOVERY_LIMIT: "10"
