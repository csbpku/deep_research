name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-unit:
    name: web (typecheck + unit + build smoke)
    runs-on: ubuntu-latest
    env:
      # next build 在收集 page data 时校验 env；用 fake 值满足校验
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/_unused
      NEXTAUTH_SECRET: ci-build-smoke-fake-secret-not-used-at-build-time
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-build-fake-client-id
      GOOGLE_CLIENT_SECRET: ci-build-fake-client-secret
      ALLOWED_EMAIL_DOMAINS: example.com
      AI_ENGINE_URL: http://localhost:4000
      TAVILY_API_KEY: tvly-ci-fake-key
      ANTHROPIC_API_KEY: sk-ant-ci-fake-key
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10.0.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter @deep-research/web db:generate
      - name: Typecheck (monorepo)
        run: pnpm -r typecheck
      - name: Web unit tests
        run: pnpm --filter @deep-research/web test
      - name: Web build smoke
        run: pnpm --filter @deep-research/web build
        timeout-minutes: 5
      # Python unit + e2e + ruff + mypy 都跑在 python-e2e job（统一 uv 环境）

  web-e2e:
    name: web (Playwright E2E)
    runs-on: ubuntu-latest
    needs: web-unit
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deep_research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deep_research_test
      NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-prod-please-rotate
      NEXTAUTH_URL: http://localhost:3000
      E2E: "1"
      AI_ENGINE_URL: http://localhost:4000
      # CI 用 fake secrets（NextAuth/AI engine env 校验）
      GOOGLE_CLIENT_ID: ci-fake-client-id
      GOOGLE_CLIENT_SECRET: ci-fake-client-secret
      ANTHROPIC_API_KEY: sk-ant-ci-fake-key
      TAVILY_API_KEY: tvly-ci-fake-key
      ALLOWED_EMAIL_DOMAINS: example.com
      # 阻止 dev server 启动时尝试拉取 telemetry / 远程字体
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10.0.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate (web-e2e needs it before next dev)
        run: pnpm --filter @deep-research/web db:generate

      - name: Prisma migrate (test DB)
        run: pnpm --filter @deep-research/web prisma migrate deploy

      - name: Seed minimal test data
        run: pnpm --filter @deep-research/web db:seed:e2e
        continue-on-error: true  # 大多数测试兼容空库；只在跨模块 list/detail 联动时需要

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @deep-research/web exec playwright install --with-deps chromium

      - name: Playwright E2E
        run: pnpm --filter @deep-research/web test:e2e
        timeout-minutes: 10
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

      - name: Upload Playwright test-results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 14

  python-e2e:
    name: python (pytest -m e2e)
    runs-on: ubuntu-latest
    needs: web-unit
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deep_research_test_py
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deep_research_test_py
      E2E: "1"
      AI_ENGINE_ADAPTER: fake
      JOB_RUNNER_BACKEND: db
      ANTHROPIC_API_KEY: sk-ant-ci-fake-key
      TAVILY_API_KEY: tvly-ci-fake-key

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with: { version: 10.0.0 }
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync uv deps
        working-directory: packages/ai-engine
        run: uv sync --frozen

      - name: Prisma migrate
        working-directory: apps/web
        run: pnpm exec prisma migrate deploy

      - name: Python E2E (real PG + fake adapter)
        working-directory: packages/ai-engine
        run: AI_ENGINE_ADAPTER=fake JOB_RUNNER_BACKEND=db uv run pytest -m e2e -v
        timeout-minutes: 8

      - name: Python unit tests
        working-directory: packages/ai-engine
        run: uv run pytest -q
        timeout-minutes: 5

      - name: Python ruff
        working-directory: packages/ai-engine
        run: uv run ruff check .

      - name: Python mypy
        working-directory: packages/ai-engine
        run: uv run mypy ai_engine tools
        continue-on-error: true  # W9 收尾