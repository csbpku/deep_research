name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded PR runs can stop; every main push keeps its validation/release path.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide whether this change touches anything that the heavy jobs below
  # actually verify. A documentation-only change cannot break the type
  # checker, the unit tests, the Playwright suites or the Python gate, so
  # running them is pure noise. The decision is made inside a job that always
  # runs: a workflow-level path filter would leave the required checks
  # permanently pending and block every merge.
  changes:
    name: Detect documentation-only changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      scope: ${{ steps.detect.outputs.scope }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The detector diffs against the base commit, so the whole history
          # has to be present in the checkout. The default pull_request
          # checkout is the merge ref, whose second parent is the branch
          # head, so the head SHA stays reachable for the diff.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test CI and release tooling
        run: |
          node --test scripts/tests/ci-changed-paths.test.mjs scripts/tests/ci-change-plan.test.mjs
          node --test scripts/tests/playwright-deps-packages.test.mjs
          bash -n infra/deploy-release.sh

      - name: Create validation and release plan
        id: detect
        env:
          PLAN_PATH: ${{ runner.temp }}/ci-change-plan.json
        run: node scripts/ci-change-plan.mjs

      - name: Save the exact comparison used by CI
        uses: actions/upload-artifact@v7
        with:
          name: ci-change-plan
          path: ${{ runner.temp }}/ci-change-plan.json
          retention-days: 14

  # Pin the runner image instead of following ubuntu-latest OS migrations.
  web-unit:
    name: web (typecheck + unit + build smoke)
    needs: changes
    # A skipped job counts as a successful check, so the skip condition must
    # only apply when the detector actually succeeded. If the detector job
    # failed or was cancelled, the heavy jobs have to run.
    if: ${{ always() && !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    env:
      # next build 在收集 page data 时校验 env；用 fake 值满足校验
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/_unused
      NEXTAUTH_SECRET: ci-build-smoke-fake-secret-not-used-at-build-time
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-build-fake-client-id
      GOOGLE_CLIENT_SECRET: ci-build-fake-client-secret
      ALLOWED_EMAIL_DOMAINS: example.com
      AI_ENGINE_URL: http://localhost:4000
      TAVILY_API_KEY: tvly-ci-fake-key
      ANTHROPIC_API_KEY: sk-ant-ci-fake-key
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (Node 24; direct pnpm 10 install)
        with: { version: 10.0.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter @deep-research/web db:generate
      - name: Typecheck (monorepo)
        run: pnpm -r typecheck
      - name: Workspace unit tests
        run: pnpm test
      - name: Test the Playwright dependency installer
        # This job has the workspace dependencies installed, so the suite
        # runs for real here. The change detection job only checks that the
        # script is syntactically valid.
        run: node --test scripts/tests/playwright-deps-packages.test.mjs
      - name: Test release and rollback behavior
        run: node --test scripts/tests/ci-*.test.mjs
      - name: Web build smoke
        run: pnpm --filter @deep-research/web build
        timeout-minutes: 5
      # Python unit + e2e + ruff + mypy 都跑在 python-e2e job（统一 uv 环境）

  web-e2e:
    name: web (Playwright E2E)
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    # The browser system dependencies are installed from a cached apt archive,
    # but a cold cache still has to reach the Ubuntu mirror. The budget
    # covers the worst observed cold start (11m12s of downloads) plus the
    # E2E suite itself (~4m) plus the surrounding setup.
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deep_research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deep_research_test
      NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-prod-please-rotate
      NEXTAUTH_URL: http://localhost:3000
      E2E: "1"
      AI_ENGINE_URL: http://localhost:4000
      # CI 用 fake secrets（NextAuth/AI engine env 校验）
      INTERNAL_SERVICE_TOKEN: ci-web-e2e-service-token-not-for-production
      GOOGLE_CLIENT_ID: ci-fake-client-id
      GOOGLE_CLIENT_SECRET: ci-fake-client-secret
      ANTHROPIC_API_KEY: sk-ant-ci-fake-key
      TAVILY_API_KEY: tvly-ci-fake-key
      ALLOWED_EMAIL_DOMAINS: example.com
      # 阻止 dev server 启动时尝试拉取 telemetry / 远程字体
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (Node 24; direct pnpm 10 install)
        with: { version: 10.0.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1 (Node 24)
        with:
          version: latest
          # Preserve v4's uncached installs; v10 otherwise enables caching.
          enable-cache: "false"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate (web-e2e needs it before next dev)
        run: pnpm --filter @deep-research/web db:generate

      - name: Prisma migrate (test DB)
        # 用 `exec` 显式说明是执行命令（不要把 `prisma` 当 script 名）。
        # 没有 `exec` 时 pnpm 找不到名为 "prisma" 的 script，会以 exit 0 静默退出，
        # 导致 schema 永远没 migrate，dev server 一查表就 500。
        run: pnpm --filter @deep-research/web exec prisma migrate deploy

      - name: Prisma schema drift check (schema.prisma vs migrated DB)
        # Fails if schema.prisma diverges from what the SQL migrations produce.
        # Known harmless noise is allow-listed in scripts/check-schema-drift.sh.
        run: scripts/check-schema-drift.sh

      - name: Seed minimal test data
        run: pnpm --filter @deep-research/web db:seed:e2e
        continue-on-error: true  # 大多数测试兼容空库；只在跨模块 list/detail 联动时需要

      - name: Sync fake AI engine dependencies
        working-directory: packages/ai-engine
        run: uv sync --frozen

      - name: Start fake AI engine
        working-directory: packages/ai-engine
        env:
          AI_ENGINE_ADAPTER: fake
          JOB_RUNNER_BACKEND: db
          AI_JOB_WORKER_ENABLED: "1"
          SHARE_WORKER_ENABLED: "0"
          FACT_REVIEW_WORKER_ENABLED: "0"
          EVIDENCE_RECONCILIATION_ENABLED: "0"
          IMPORT_WORKER_ENABLED: "0"
          RADAR_SYNC_CRON_ENABLED: "0"
          RADAR_ENRICHMENT_RECOVERY_ENABLED: "0"
          LLM_RECOVERY_ENABLED: "0"
          RADAR_RENDER_REVIEW_ENABLED: "0"
          RADAR_REVIEW_RECONCILIATION_ENABLED: "0"
          SUBMISSION_WORKER_ENABLED: "0"
          TOPIC_PROPOSAL_ENABLED: "0"
          TOPIC_SYNTHESIS_ENABLED: "0"
          TOPIC_ISSUE_ENABLED: "0"
        run: |
          uv run uvicorn ai_engine.server.app:app --host 127.0.0.1 --port 4000 > "$RUNNER_TEMP/ai-engine.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/ai-engine.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/healthz > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/ai-engine.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/ai-engine.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ai-engine.log"
          exit 1

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Cache the Playwright system dependency archive
        # The .deb files for the browser system dependencies are persisted
        # separately from the browser binaries. Installing them from the
        # cache keeps a throttled Ubuntu mirror from deciding how long this
        # job takes.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: /var/cache/apt/playwright
          key: playwright-deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-deps-${{ runner.os }}-

      - name: Install Playwright browsers and OS dependencies
        # The browser binaries come from the Playwright cache, the system
        # packages from the apt archive cache. Both have to be installed on
        # every fresh runner; the caches only remove the downloads.
        run: |
          pnpm --filter @deep-research/web exec playwright install chromium
          scripts/install-playwright-deps.sh

      - name: Playwright E2E
        run: pnpm --filter @deep-research/web test:e2e
        timeout-minutes: 10
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

      - name: Upload Playwright test-results (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: playwright-test-results
          path: apps/web/test-results
          retention-days: 14

      - name: Upload fake AI engine log (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: fake-ai-engine-log
          path: ${{ runner.temp }}/ai-engine.log
          retention-days: 14

      - name: Stop fake AI engine
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ai-engine.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/ai-engine.pid")" || true
          fi

  web-mui-e2e:
    name: web (isolated MUI E2E)
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    # Same reasoning as the web E2E job: the cold cache has to survive a
    # throttled mirror.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deep_research_mui_e2e_20261020
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/deep_research_mui_e2e_20261020
      MUI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/deep_research_mui_e2e_20261020
      MUI_DETAIL_FIXTURES: "1"
      MUI_ISOLATED_BROWSER: "1"
      E2E_PRODUCTION: "1"
      E2E: "1"
      E2E_BASE_URL: http://127.0.0.1:3188
      NEXTAUTH_URL: http://127.0.0.1:3188
      NEXTAUTH_SECRET: ci-mui-fixture-secret-never-for-production
      # This service binds only loopback; production retains HTTPS-only auth.
      AUTH_ALLOW_INSECURE_HTTP: "1"
      AI_ENGINE_URL: http://127.0.0.1:1
      INTERNAL_SERVICE_TOKEN: ci-mui-fixture-token-never-for-production
      GOOGLE_CLIENT_ID: ci-mui-fake-client-id
      GOOGLE_CLIENT_SECRET: ci-mui-fake-client-secret
      ANTHROPIC_API_KEY: sk-ant-ci-fake-key
      TAVILY_API_KEY: tvly-ci-fake-key
      ALLOWED_EMAIL_DOMAINS: e2e.local
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (Node 24; direct pnpm 10 install)
        with: { version: 10.0.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deep-research/web db:generate
      - name: Migrate fresh isolated fixture database
        run: pnpm --filter @deep-research/web exec prisma migrate deploy
      - name: Seed dedicated MUI identities and content
        run: pnpm --filter @deep-research/web exec tsx scripts/seed-mui-browser.ts
      - name: Build production fixture service
        run: pnpm --filter @deep-research/web build
      - name: Cache the Playwright system dependency archive
        # See the web E2E job for the rationale: the .deb files are cached so
        # a throttled Ubuntu mirror cannot decide how long this job takes.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: /var/cache/apt/playwright
          key: playwright-deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-deps-${{ runner.os }}-
      - name: Install Playwright Chromium
        run: |
          pnpm --filter @deep-research/web exec playwright install chromium
          scripts/install-playwright-deps.sh
      - name: Start production fixture service
        run: |
          pnpm --filter @deep-research/web exec next start --hostname 127.0.0.1 --port 3188 > "$RUNNER_TEMP/mui-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mui-web.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3188/api/healthz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/mui-web.log"
          exit 1
      - name: Isolated MUI production browser tests
        run: pnpm --filter @deep-research/web test:e2e
      - name: Upload isolated browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: mui-browser-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
            ${{ runner.temp }}/mui-web.log
          retention-days: 14
      - name: Stop isolated fixture service
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mui-web.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/mui-web.pid")" || true
          fi

  python-e2e:
    name: python (pytest -m e2e)
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deep_research_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/deep_research_e2e
      E2E: "1"
      AI_ENGINE_ADAPTER: fake
      JOB_RUNNER_BACKEND: db
      ANTHROPIC_API_KEY: sk-ant-ci-fake-key
      TAVILY_API_KEY: tvly-ci-fake-key

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (Node 24; direct pnpm 10 install)
        with: { version: 10.0.0 }
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1 (Node 24)
        with:
          version: latest
          enable-cache: "false"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync uv deps
        working-directory: packages/ai-engine
        run: uv sync --frozen

      - name: Prisma migrate
        working-directory: apps/web
        run: pnpm exec prisma migrate deploy

      - name: Python E2E (real PG + fake adapter)
        working-directory: packages/ai-engine
        run: E2E=1 uv run pytest -m e2e -v
        timeout-minutes: 8

      - name: Python unit tests
        working-directory: packages/ai-engine
        env:
          TEST_TOPIC_DATABASE_URL: ${{ env.DATABASE_URL }}
        # 排除 e2e（CI 上一条 step 单独跑）和 requires_db（需要专用 test DB，本 step
        # 复用 deep_research_e2e 跑 e2e 后已 truncate，跑 requires_db 会踩到别的状态；
        # 真要跑 requires_db 在本地 `uv run pytest -m requires_db`）。
        run: E2E=0 uv run pytest -q -m "not e2e and not requires_db"
        timeout-minutes: 5

      - name: Python ruff
        working-directory: packages/ai-engine
        run: uv run ruff check .

      - name: Python mypy
        working-directory: packages/ai-engine
        run: uv run mypy ai_engine tools

  reader-e2e:
    name: reader (extension E2E)
    needs: changes
    if: ${{ always() && !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    # Same reasoning as the web E2E job: the cold cache has to survive a
    # throttled mirror.
    timeout-minutes: 30

    env:
      # The extension talks to a local fixture over loopback, so the E2E
      # browser needs loopback access and a deterministic build.
      READER_HEADLESS: "1"
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0 (Node 24; direct pnpm 10 install)
        with: { version: 10.0.0 }
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      - name: Verify the shared design system is generated and current
        run: |
          node packages/design-system/scripts/generate.mjs --check
          node apps/extension/scripts/generate-design-system.mjs --check

      - name: Build the extension
        run: pnpm --filter @deep-research/reader-extension build

      - name: Verify the built Reader release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm --filter @deep-research/reader-extension package:beta
          version="$(node -p "require('./apps/extension/package.json').version")"
          node scripts/ci-reader-beta.mjs verify "apps/extension/.output/deep-research-reader-beta-$version.zip" "$RUNNER_TEMP/reader-beta"

      - name: Cache the Playwright system dependency archive
        # See the web E2E job for the rationale: the .deb files are cached so
        # a throttled Ubuntu mirror cannot decide how long this job takes.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 (Node 24)
        with:
          path: /var/cache/apt/playwright
          key: playwright-deps-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-deps-${{ runner.os }}-

      # The extension requires a real Chromium build: Firefox cannot load
      # MV3 extensions and the headless shell cannot run them either.
      - name: Install Chromium for extension E2E
        run: |
          pnpm --filter @deep-research/web exec playwright install chromium
          scripts/install-playwright-deps.sh

      - name: Resolve the Chromium binary for extension E2E
        id: chrome
        run: |
          binary="$(find "$HOME/.cache/ms-playwright" -name chrome -type f -path '*chrome-linux*' | head -n 1)"
          if [ -z "$binary" ]; then
            echo "Chromium binary not found under $HOME/.cache/ms-playwright" >&2
            exit 1
          fi
          echo "path=$binary" >> "$GITHUB_OUTPUT"

      - name: Reader visual E2E
        env:
          CHROME_FOR_TESTING: ${{ steps.chrome.outputs.path }}
        run: pnpm --filter @deep-research/reader-extension e2e:visual
        timeout-minutes: 8

      - name: Reader model configuration E2E
        env:
          CHROME_FOR_TESTING: ${{ steps.chrome.outputs.path }}
        run: pnpm --filter @deep-research/reader-extension e2e:model-configuration
        timeout-minutes: 5

      - name: Reader interaction audit
        env:
          CHROME_FOR_TESTING: ${{ steps.chrome.outputs.path }}
        run: pnpm --filter @deep-research/reader-extension e2e:interaction-audit
        timeout-minutes: 8

      - name: Reader full-page translation E2E
        env:
          CHROME_FOR_TESTING: ${{ steps.chrome.outputs.path }}
        run: pnpm --filter @deep-research/reader-extension e2e:full-page-translation
        timeout-minutes: 8

      - name: Reader selection explanation E2E
        env:
          CHROME_FOR_TESTING: ${{ steps.chrome.outputs.path }}
        run: pnpm --filter @deep-research/reader-extension e2e:selection-explain
        timeout-minutes: 5

      - name: Save the verified Reader package for deployment
        uses: actions/upload-artifact@v7
        with:
          name: reader-beta
          path: ${{ runner.temp }}/reader-beta/
          retention-days: 14

  # The required checks above are the five heavy suites. A skipped job counts
  # as a successful check, so on their own they would let a broken
  # documentation-only run look green. This gate always runs and fails the
  # workflow unless either the change was classified as documentation or every
  # heavy suite actually succeeded.
  ci-gate:
    name: CI gate
    needs: [changes, web-unit, web-e2e, web-mui-e2e, python-e2e, reader-e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the CI scope decision
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          WEB_UNIT: ${{ needs.web-unit.result }}
          WEB_E2E: ${{ needs.web-e2e.result }}
          WEB_MUI_E2E: ${{ needs.web-mui-e2e.result }}
          PYTHON_E2E: ${{ needs.python-e2e.result }}
          READER_E2E: ${{ needs.reader-e2e.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Change planning did not succeed."
            exit 1
          fi
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "Documentation-only change: the heavy suites were skipped by design."
            exit 0
          fi
          failed=0
          for suite in WEB_UNIT WEB_E2E WEB_MUI_E2E PYTHON_E2E READER_E2E; do
            result="${!suite}"
            if [ "$result" != "success" ]; then
              echo "::error::$suite did not succeed (result: $result)" >&2
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "The change was not classified as documentation-only, so every heavy suite has to pass." >&2
            exit 1
          fi
          echo "All heavy suites passed."
