name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAMESPACE: ghcr.io/csbpku/deep-research
  SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish-images:
    name: Build and publish GHCR images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare web image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/web
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web.Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,mode=max,scope=web-image

      - name: Prepare AI engine image metadata
        id: ai-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/ai-engine
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest

      - name: Build and push AI engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/ai-engine.Dockerfile
          push: true
          tags: ${{ steps.ai-meta.outputs.tags }}
          labels: ${{ steps.ai-meta.outputs.labels }}
          cache-from: type=gha,scope=ai-image
          cache-to: type=gha,mode=max,scope=ai-image

      - name: Prepare render-review image metadata
        id: render-review-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/render-review
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest

      - name: Build and push render-review image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/render-review.Dockerfile
          push: true
          tags: ${{ steps.render-review-meta.outputs.tags }}
          labels: ${{ steps.render-review-meta.outputs.labels }}
          cache-from: type=gha,scope=render-review-image
          cache-to: type=gha,mode=max,scope=render-review-image

  deploy:
    name: Deploy tested images to VPS
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    needs: publish-images
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      WEB_IMAGE: ghcr.io/csbpku/deep-research/web:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      AI_ENGINE_IMAGE: ghcr.io/csbpku/deep-research/ai-engine:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      RENDER_REVIEW_IMAGE: ghcr.io/csbpku/deep-research/render-review:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/deep_research' }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "VPS_HOST is required"; exit 1; }
          test -n "$VPS_USER" || { echo "VPS_USER is required"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "VPS_KNOWN_HOSTS is required"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is required"; exit 1; }
          test -n "$VPS_DEPLOY_PATH" || { echo "VPS_DEPLOY_PATH is required"; exit 1; }
          if [ -n "$GHCR_READ_TOKEN" ] && [ -z "$GHCR_USERNAME" ]; then
            echo "GHCR_USERNAME is required when GHCR_READ_TOKEN is set"
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure SSH host verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload deployment files
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh "$target" "mkdir -p -- '$VPS_DEPLOY_PATH/infra'"
          scp \
            infra/docker-compose.yml \
            infra/docker-compose.registry.yml \
            infra/nginx.conf \
            infra/nginx-tls.conf \
            infra/import-tmp-cleanup.sh \
            infra/pg-backup.sh \
            infra/pg-restore.sh \
            "$target:$VPS_DEPLOY_PATH/infra/"

      - name: Log in to private GHCR (optional)
        if: env.GHCR_READ_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          username=$(printf '%q' "$GHCR_USERNAME")
          printf '%s' "$GHCR_READ_TOKEN" \
            | ssh "$target" "docker login ghcr.io --username $username --password-stdin"

      - name: Pull, migrate, and health-check
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          quote_for_shell() {
            printf '%q' "$1"
          }
          ssh \
            "$target" \
            "DEPLOY_PATH=$(quote_for_shell "$VPS_DEPLOY_PATH") \
             IMAGE_TAG=$(quote_for_shell "$IMAGE_TAG") \
             WEB_IMAGE=$(quote_for_shell "$WEB_IMAGE") \
             AI_ENGINE_IMAGE=$(quote_for_shell "$AI_ENGINE_IMAGE") \
             RENDER_REVIEW_IMAGE=$(quote_for_shell "$RENDER_REVIEW_IMAGE") \
             bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          cd "$DEPLOY_PATH"
          test -f .env
          test -f infra/docker-compose.registry.yml

          compose=(docker compose
            --env-file .env
            -f infra/docker-compose.yml
            -f infra/docker-compose.registry.yml)
          previous_tag="$(cat .deployed-image-tag 2>/dev/null || true)"

          rollback() {
            status=$?
            echo "[deploy] release failed; preserving logs and attempting image rollback" >&2
            if [ -n "$previous_tag" ]; then
              export WEB_IMAGE="ghcr.io/csbpku/deep-research/web:$previous_tag"
              export AI_ENGINE_IMAGE="ghcr.io/csbpku/deep-research/ai-engine:$previous_tag"
              export RENDER_REVIEW_IMAGE="ghcr.io/csbpku/deep-research/render-review:$previous_tag"
              "${compose[@]}" pull web ai-engine render-review || true
              "${compose[@]}" up -d --no-build --remove-orphans || true
            fi
            "${compose[@]}" ps || true
            exit "$status"
          }
          trap rollback ERR

          echo "[deploy] validating compose configuration"
          "${compose[@]}" config --quiet
          echo "[deploy] pulling $IMAGE_TAG"
          "${compose[@]}" pull web ai-engine render-review
          echo "[deploy] starting services; web entrypoint will apply migrations"
          "${compose[@]}" up -d --no-build --remove-orphans
          echo "[deploy] waiting for public health endpoints"
          curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-connrefused \
            http://127.0.0.1/healthz >/dev/null
          curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-connrefused \
            http://127.0.0.1/ai-healthz >/dev/null
          printf '%s\n' "$IMAGE_TAG" > .deployed-image-tag
          trap - ERR
          "${compose[@]}" ps
          echo "[deploy] release $IMAGE_TAG is healthy"
          REMOTE_SCRIPT
