name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  IMAGE_NAMESPACE: ghcr.io/csbpku/deep-research
  SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish-images:
    name: Build and publish GHCR images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare web image metadata
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/web
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web.Dockerfile
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,mode=max,scope=web-image

      - name: Prepare AI engine image metadata
        id: ai-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/ai-engine
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest

      - name: Build and push AI engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/ai-engine.Dockerfile
          push: true
          tags: ${{ steps.ai-meta.outputs.tags }}
          labels: ${{ steps.ai-meta.outputs.labels }}
          cache-from: type=gha,scope=ai-image
          cache-to: type=gha,mode=max,scope=ai-image

  publish-reader-beta:
    name: Publish Reader Beta release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    needs: publish-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.release.outputs.sha256 }}
      url: ${{ steps.release.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Resolve immutable Beta release
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./apps/extension/package.json').version")"
          manifest_version="$(node -p "require('./apps/extension/manifest.json').version")"
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || {
            echo "Extension version must be valid semver" >&2
            exit 1
          }
          test "$package_version" = "$manifest_version" || {
            echo "Extension package and manifest versions differ" >&2
            exit 1
          }
          tag="reader-v$package_version"

          previous_sha="$(git rev-parse "$SOURCE_SHA^" 2>/dev/null || true)"
          if [ -n "$previous_sha" ] && ! git diff --quiet "$previous_sha" "$SOURCE_SHA" -- apps/extension ':!apps/extension/README.md'; then
            previous_version="$(git show "$previous_sha:apps/extension/manifest.json" 2>/dev/null | node -e 'let text=""; process.stdin.on("data", chunk => text += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(text).version));' || true)"
            if [ "$previous_version" = "$package_version" ]; then
              echo "Extension source changed without a version bump; update the extension version before publishing" >&2
              exit 1
            fi
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_sha="$(git rev-list -n 1 "$tag")"
            git diff --quiet "$release_sha" "$SOURCE_SHA" -- apps/extension ':!apps/extension/README.md' || {
              echo "$tag already points to different extension sources; bump the version" >&2
              exit 1
            }
            is_prerelease="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
            test "$is_prerelease" = true || {
              echo "$tag already exists but is not a pre-release" >&2
              exit 1
            }
            publish=false
          else
            publish=true
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=deep-research-reader-beta-$package_version.zip" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.metadata.outputs.publish == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Set up Node.js
        if: steps.metadata.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Build extension Beta package
        if: steps.metadata.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @deep-research/reader-extension build
          pnpm --filter @deep-research/reader-extension package:beta
          archive="apps/extension/.output/${{ steps.metadata.outputs.asset }}"
          unzip -tq "$archive"
          archive_version="$(unzip -p "$archive" manifest.json | node -e 'let text=""; process.stdin.on("data", chunk => text += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(text).version));')"
          test "$archive_version" = "${{ steps.metadata.outputs.version }}"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
        id: build

      - name: Publish versioned pre-release
        if: steps.metadata.outputs.publish == 'true'
        id: create_release
        shell: bash
        run: |
          set -euo pipefail
          archive="apps/extension/.output/${{ steps.metadata.outputs.asset }}"
          sha256="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          notes=$(printf 'Deep Research Reader Beta %s.\n\n- Install the standalone extension from the attached ZIP.\n- Platform mode connects after signing in to Deep Research.\n- SHA-256: `%s`' \
            "${{ steps.metadata.outputs.version }}" "$sha256")
          gh release create "${{ steps.metadata.outputs.tag }}" "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Deep Research Reader Beta ${{ steps.metadata.outputs.version }}" \
            --prerelease \
            --notes "$notes"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Verify existing pre-release asset
        if: steps.metadata.outputs.publish == 'false'
        id: existing_release
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="$RUNNER_TEMP/reader-beta-${{ steps.metadata.outputs.version }}"
          mkdir -p "$archive_dir"
          gh release download "${{ steps.metadata.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ steps.metadata.outputs.asset }}" \
            --dir "$archive_dir"
          archive="$archive_dir/${{ steps.metadata.outputs.asset }}"
          unzip -tq "$archive"
          archive_version="$(unzip -p "$archive" manifest.json | node -e 'let text=""; process.stdin.on("data", chunk => text += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(text).version));')"
          test "$archive_version" = "${{ steps.metadata.outputs.version }}"
          echo "sha256=$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Export Beta release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          echo "version=${{ steps.metadata.outputs.version }}" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.metadata.outputs.publish }}" = true ]; then
            sha256="${{ steps.create_release.outputs.sha256 }}"
          else
            sha256="${{ steps.existing_release.outputs.sha256 }}"
          fi
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/${{ steps.metadata.outputs.tag }}/${{ steps.metadata.outputs.asset }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy tested images to VPS
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    needs: [publish-images, publish-reader-beta]
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      WEB_IMAGE: ghcr.io/csbpku/deep-research/web:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      AI_ENGINE_IMAGE: ghcr.io/csbpku/deep-research/ai-engine:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      READER_BETA_URL: ${{ needs.publish-reader-beta.outputs.url }}
      READER_BETA_VERSION: ${{ needs.publish-reader-beta.outputs.version }}
      READER_BETA_SHA256: ${{ needs.publish-reader-beta.outputs.sha256 }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/deep_research' }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      # The images are published by this repository's GITHUB_TOKEN. Prefer the
      # same token for pulls so a stale optional PAT cannot block deployment.
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "VPS_HOST is required"; exit 1; }
          test -n "$VPS_USER" || { echo "VPS_USER is required"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "VPS_KNOWN_HOSTS is required"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is required"; exit 1; }
          test -n "$VPS_DEPLOY_PATH" || { echo "VPS_DEPLOY_PATH is required"; exit 1; }
          test -n "$READER_BETA_URL" || { echo "Reader Beta release URL is required"; exit 1; }
          test -n "$READER_BETA_VERSION" || { echo "Reader Beta version is required"; exit 1; }
          [[ "$READER_BETA_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Reader Beta SHA-256 is invalid"; exit 1; }
          if [ -n "$GHCR_READ_TOKEN" ] && [ -z "$GHCR_USERNAME" ]; then
            echo "GHCR_USERNAME is required when GHCR_READ_TOKEN is set"
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure SSH host verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload deployment files
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh_options=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30)
          ssh "${ssh_options[@]}" "$target" "mkdir -p -- '$VPS_DEPLOY_PATH/infra'"
          scp "${ssh_options[@]}" \
            infra/docker-compose.yml \
            infra/docker-compose.registry.yml \
            infra/docker-compose.registry-render-review.yml \
            infra/docker-compose.certbot.yml \
            infra/certbot.Dockerfile \
            infra/nginx.conf \
            infra/nginx-tls.conf \
            infra/certbot-renew.sh \
            infra/import-tmp-cleanup.sh \
            infra/pg-backup.sh \
            infra/pg-restore.sh \
            "$target:$VPS_DEPLOY_PATH/infra/"

      - name: Log in to private GHCR (optional)
        if: env.GHCR_READ_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh_options=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30)
          username=$(printf '%q' "$GHCR_USERNAME")
          printf '%s' "$GHCR_READ_TOKEN" \
            | ssh "${ssh_options[@]}" "$target" "docker login ghcr.io --username $username --password-stdin"

      - name: Pull, migrate, and health-check
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh_options=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30)
          quote_for_shell() {
            printf '%q' "$1"
          }
          ssh "${ssh_options[@]}" \
            "$target" \
            "DEPLOY_PATH=$(quote_for_shell "$VPS_DEPLOY_PATH") \
             IMAGE_TAG=$(quote_for_shell "$IMAGE_TAG") \
             WEB_IMAGE=$(quote_for_shell "$WEB_IMAGE") \
             AI_ENGINE_IMAGE=$(quote_for_shell "$AI_ENGINE_IMAGE") \
             READER_BETA_URL=$(quote_for_shell "$READER_BETA_URL") \
             READER_BETA_VERSION=$(quote_for_shell "$READER_BETA_VERSION") \
             READER_BETA_SHA256=$(quote_for_shell "$READER_BETA_SHA256") \
             bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          cd "$DEPLOY_PATH"
          test -f .env
          test -f infra/docker-compose.registry.yml
          test "$(stat -c '%u' .env)" = "$(id -u)" || {
            echo "The deployment account must own .env to update Reader Beta metadata without changing file ownership" >&2
            exit 1
          }

          beta_env_backup="$(mktemp "$DEPLOY_PATH/.env.reader-beta.XXXXXX")"
          cp -p .env "$beta_env_backup"
          chmod 600 "$beta_env_backup"
          beta_env_updated=0

          set_env_value() {
            local key="$1" value="$2" tmp mode
            tmp="$(mktemp "$DEPLOY_PATH/.env.reader-beta-write.XXXXXX")"
            mode="$(stat -c '%a' .env)"
            if ! awk -v key="$key" -v value="$value" '
              BEGIN { prefix = key "="; found = 0 }
              index($0, prefix) == 1 {
                if (!found) print prefix value
                found = 1
                next
              }
              { print }
              END { if (!found) print prefix value }
            ' .env > "$tmp"; then
              rm -f "$tmp"
              return 1
            fi
            chgrp --reference=.env "$tmp"
            chmod "$mode" "$tmp"
            mv -f "$tmp" .env
          }

          remove_env_value() {
            local key="$1" tmp
            tmp="$(mktemp "$DEPLOY_PATH/.env.reader-beta-write.XXXXXX")"
            if ! awk -v key="$key" 'index($0, key "=") != 1 { print }' .env > "$tmp"; then
              rm -f "$tmp"
              return 1
            fi
            chgrp --reference=.env "$tmp"
            chmod "$(stat -c '%a' .env)" "$tmp"
            mv -f "$tmp" .env
          }

          restore_beta_env() {
            local key value
            for key in READING_EXTENSION_BETA_URL READING_EXTENSION_BETA_PATH READING_EXTENSION_BETA_VERSION READING_EXTENSION_BETA_SHA256; do
              if grep -q "^${key}=" "$beta_env_backup"; then
                value="$(awk -v key="$key" 'index($0, key "=") == 1 { sub("^[^=]*=", ""); print; exit }' "$beta_env_backup")"
                set_env_value "$key" "$value"
              else
                remove_env_value "$key"
              fi
            done
          }

          compose=(docker compose
            --env-file .env
            -f infra/docker-compose.yml
            -f infra/docker-compose.registry.yml)
          previous_tag="$(cat .deployed-image-tag 2>/dev/null || true)"

          rollback() {
            status=$?
            trap - ERR
            set +e
            echo "[deploy] release failed; restoring previous Beta config and attempting image rollback" >&2
            if [ "$beta_env_updated" -eq 1 ]; then restore_beta_env || true; fi
            if [[ "$previous_tag" =~ ^[0-9a-f]{40}$ ]]; then
              export WEB_IMAGE="ghcr.io/csbpku/deep-research/web:$previous_tag"
              export AI_ENGINE_IMAGE="ghcr.io/csbpku/deep-research/ai-engine:$previous_tag"
              timeout --signal=TERM --kill-after=30s 10m \
                "${compose[@]}" pull web ai-engine || true
              timeout --signal=TERM --kill-after=30s 5m \
                "${compose[@]}" up -d --no-build --remove-orphans || true
            else
              echo "[deploy] no valid previous registry SHA; skipping image rollback" >&2
            fi
            "${compose[@]}" ps || true
            rm -f "$beta_env_backup"
            exit "$status"
          }
          trap rollback ERR

          beta_env_updated=1
          set_env_value READING_EXTENSION_BETA_URL "$READER_BETA_URL"
          set_env_value READING_EXTENSION_BETA_PATH ""
          set_env_value READING_EXTENSION_BETA_VERSION "$READER_BETA_VERSION"
          set_env_value READING_EXTENSION_BETA_SHA256 "$READER_BETA_SHA256"

          echo "[deploy] validating compose configuration"
          "${compose[@]}" config --quiet
          echo "[deploy] pulling $IMAGE_TAG"
          pull_one_image() {
            local service="$1"
            local attempt
            for attempt in 1 2 3; do
              echo "[deploy] pulling $service (attempt $attempt/3; 15 minute limit)"
              if timeout --signal=TERM --kill-after=30s 15m \
                "${compose[@]}" pull "$service"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "[deploy] $service pull failed or timed out; retrying in 15 seconds" >&2
                sleep 15
              fi
            done
            return 1
          }
          pull_log_dir="$(mktemp -d)"
          trap 'rm -rf "$pull_log_dir"' EXIT
          pull_one_image web >"$pull_log_dir/web.log" 2>&1 &
          web_pull_pid=$!
          pull_one_image ai-engine >"$pull_log_dir/ai-engine.log" 2>&1 &
          ai_pull_pid=$!

          pull_failed=0
          if ! wait "$web_pull_pid"; then pull_failed=1; fi
          if ! wait "$ai_pull_pid"; then pull_failed=1; fi
          for service in web ai-engine; do
            echo "[deploy] $service pull log"
            cat "$pull_log_dir/$service.log"
          done
          if [ "$pull_failed" -ne 0 ]; then
            echo "[deploy] one or more image pulls failed" >&2
            exit 1
          fi
          echo "[deploy] starting services; web entrypoint will apply migrations"
          "${compose[@]}" up -d --no-build --remove-orphans
          echo "[deploy] waiting for public health endpoints"
          wait_for_endpoint() {
            local label="$1"
            local url="$2"
            local attempt
            for attempt in $(seq 1 40); do
              if curl --fail --silent --show-error --max-time 10 "$url" >/dev/null; then
                echo "[deploy] $label is healthy (attempt $attempt/40)"
                return 0
              fi
              echo "[deploy] $label not ready (attempt $attempt/40); retrying in 3 seconds" >&2
              sleep 3
            done
            echo "[deploy] $label did not become healthy within 120 seconds" >&2
            return 1
          }
          wait_for_endpoint web http://127.0.0.1/healthz
          wait_for_endpoint ai http://127.0.0.1/ai-healthz
          printf '%s\n' "$IMAGE_TAG" > .deployed-image-tag
          rm -f "$beta_env_backup"
          trap - ERR
          "${compose[@]}" ps
          echo "[deploy] release $IMAGE_TAG is healthy"
          REMOTE_SCRIPT
