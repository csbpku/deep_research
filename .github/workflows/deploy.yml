name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the production mutation is serialized; documentation runs cannot displace
# pending code releases, and builds for independent commits can finish in parallel.
concurrency:
  group: deploy-source-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAMESPACE: ghcr.io/csbpku/deep-research
  SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  changes:
    name: Resolve tested release plan
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      deployable: ${{ steps.plan.outputs.deployable }}
      ci_run_id: ${{ steps.plan.outputs.ci_run_id }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Read the successful CI plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-release-plan.mjs

  publish-images:
    name: Publish ${{ matrix.image }} image
    needs: changes
    if: needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            cache: web-image
          - image: ai-engine
            cache: ai-image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ env.SOURCE_SHA }}
            type=raw,value=latest
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/${{ matrix.image }}.Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

  publish-reader-beta:
    name: Publish verified Reader Beta
    needs: changes
    if: needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: reader-beta-release
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.release.outputs.sha256 }}
      url: ${{ steps.release.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Download the exact Reader package verified by CI
        run: gh run download "${{ needs.changes.outputs.ci_run_id }}" --repo "$GITHUB_REPOSITORY" --name reader-beta --dir "$RUNNER_TEMP/reader-beta"
      - name: Publish or verify immutable version
        id: release
        run: node scripts/ci-reader-beta.mjs publish "$RUNNER_TEMP/reader-beta"

  deploy:
    name: Deploy tested images to VPS
    if: needs.changes.outputs.deployable == 'true'
    needs: [changes, publish-images, publish-reader-beta]
    runs-on: ubuntu-24.04
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ needs.changes.outputs.source_sha }}
      WEB_IMAGE: ghcr.io/csbpku/deep-research/web:${{ needs.changes.outputs.source_sha }}
      AI_ENGINE_IMAGE: ghcr.io/csbpku/deep-research/ai-engine:${{ needs.changes.outputs.source_sha }}
      READER_BETA_URL: ${{ needs.publish-reader-beta.outputs.url }}
      READER_BETA_VERSION: ${{ needs.publish-reader-beta.outputs.version }}
      READER_BETA_SHA256: ${{ needs.publish-reader-beta.outputs.sha256 }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/deep_research' }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      # The images are published by this repository's GITHUB_TOKEN. Prefer the
      # same token for pulls so a stale optional PAT cannot block deployment.
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo "VPS_HOST is required"; exit 1; }
          test -n "$VPS_USER" || { echo "VPS_USER is required"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "VPS_KNOWN_HOSTS is required"; exit 1; }
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is required"; exit 1; }
          [[ "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9_./-]+$ ]] || { echo "VPS_DEPLOY_PATH must be an absolute path without spaces"; exit 1; }
          test -n "$READER_BETA_URL" || { echo "Reader Beta release URL is required"; exit 1; }
          test -n "$READER_BETA_VERSION" || { echo "Reader Beta version is required"; exit 1; }
          [[ "$READER_BETA_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "Reader Beta SHA-256 is invalid"; exit 1; }
          if [ -n "$GHCR_READ_TOKEN" ] && [ -z "$GHCR_USERNAME" ]; then
            echo "GHCR_USERNAME is required when GHCR_READ_TOKEN is set"
            exit 1
          fi

      - name: Start SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0 (Node 24)
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Configure SSH host verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Reject a late older deployment
        id: order
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          export CURRENT_DEPLOYED_SHA
          CURRENT_DEPLOYED_SHA="$(ssh -o ConnectTimeout=30 "$target" "cat '$VPS_DEPLOY_PATH/.deployed-image-tag' 2>/dev/null || true")"
          node scripts/ci-deploy-order.mjs

      - name: Stage deployment files without replacing live configuration
        if: steps.order.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          stage="$VPS_DEPLOY_PATH/.releases/$SOURCE_SHA"
          ssh_options=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30)
          tar -czf "$RUNNER_TEMP/deployment.tar.gz" -C "$GITHUB_WORKSPACE/infra" -T "$GITHUB_WORKSPACE/infra/deploy-files.txt"
          ssh "${ssh_options[@]}" "$target" "mkdir -p -- '$stage' '$VPS_DEPLOY_PATH/infra'"
          scp "${ssh_options[@]}" "$RUNNER_TEMP/deployment.tar.gz" "$target:$stage/deployment.tar.gz"
          ssh "${ssh_options[@]}" "$target" "tar -xzf '$stage/deployment.tar.gz' -C '$stage'"

      - name: Log in to private GHCR (optional)
        if: steps.order.outputs.deploy == 'true' && env.GHCR_READ_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh_options=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30)
          username=$(printf '%q' "$GHCR_USERNAME")
          printf '%s' "$GHCR_READ_TOKEN" \
            | ssh "${ssh_options[@]}" "$target" "docker login ghcr.io --username $username --password-stdin"

      - name: Apply staged release with configuration rollback
        if: steps.order.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="$VPS_USER@$VPS_HOST"
          ssh_options=(-o ServerAliveInterval=30 -o ServerAliveCountMax=20 -o TCPKeepAlive=yes -o ConnectTimeout=30)
          quote_for_shell() { printf '%q' "$1"; }
          ssh "${ssh_options[@]}" "$target" \
            "DEPLOY_PATH=$(quote_for_shell "$VPS_DEPLOY_PATH") \
             CANDIDATE_INFRA=$(quote_for_shell "$VPS_DEPLOY_PATH/.releases/$SOURCE_SHA") \
             IMAGE_TAG=$(quote_for_shell "$IMAGE_TAG") \
             WEB_IMAGE=$(quote_for_shell "$WEB_IMAGE") \
             AI_ENGINE_IMAGE=$(quote_for_shell "$AI_ENGINE_IMAGE") \
             READER_BETA_URL=$(quote_for_shell "$READER_BETA_URL") \
             READER_BETA_VERSION=$(quote_for_shell "$READER_BETA_VERSION") \
             READER_BETA_SHA256=$(quote_for_shell "$READER_BETA_SHA256") \
             bash $(quote_for_shell "$VPS_DEPLOY_PATH/.releases/$SOURCE_SHA/deploy-release.sh")" </dev/null
